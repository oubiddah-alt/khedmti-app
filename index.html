<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e"><meta name="description" content="Khedmti - خدمات منزلية في المغرب"><link rel="manifest" href="manifest.webmanifest"><title>Khedmti | خدمتي</title>
<style>
:root{--green:#0f766e;--green2:#115e59;--bg:#f4f7f7;--card:#fff;--text:#172525;--muted:#647575;--line:#dce7e5;--orange:#f59e0b;--red:#b91c1c}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;min-height:100dvh;background:var(--bg);padding-bottom:78px}.top{background:linear-gradient(135deg,var(--green2),var(--green));color:white;padding:20px 18px 24px;border-radius:0 0 24px 24px}.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:24px;font-weight:850;letter-spacing:-.5px}.brand small{display:block;font-size:12px;font-weight:500;opacity:.85}.lang{border:1px solid #ffffff77;background:#ffffff18;color:white;border-radius:12px;padding:8px 12px}.welcome{margin-top:22px;font-size:22px;font-weight:800}.sub{font-size:14px;opacity:.85;margin-top:5px}.content{padding:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:13px;box-shadow:0 4px 14px #1232}.sectiontitle{font-size:18px;font-weight:800;margin:10px 0 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.service{border:1px solid var(--line);background:white;border-radius:16px;padding:15px 12px;text-align:start;min-height:100px}.service .emoji{font-size:27px}.service strong{display:block;margin-top:7px}.service span{color:var(--muted);font-size:12px}.btn{border:0;background:var(--green);color:white;padding:12px 15px;border-radius:12px;font-weight:750;width:100%}.btn.secondary{background:#e4f3f0;color:var(--green2)}.btn.ghost{background:white;color:var(--green);border:1px solid var(--line)}.btn.danger{background:#fee2e2;color:var(--red)}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.field{margin-bottom:12px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:12px;color:var(--text)}.field textarea{min-height:86px;resize:vertical}.muted{color:var(--muted);font-size:13px}.pill{display:inline-block;border-radius:999px;background:#e4f3f0;color:var(--green2);padding:5px 9px;font-size:12px;font-weight:700}.price{font-size:22px;font-weight:850}.listitem{border:1px solid var(--line);padding:13px;border-radius:14px;margin:10px 0;background:white}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fffffff2;backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}.nav{width:min(760px,100%);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}.nav button{border:0;background:transparent;color:var(--muted);font-size:11px;padding:4px 8px;min-width:60px}.nav button.active{color:var(--green);font-weight:800}.nav .ico{font-size:20px;display:block;margin-bottom:2px}.notice{background:#fff7e6;border:1px solid #f4d28a;color:#77530b;border-radius:12px;padding:11px;font-size:12px;line-height:1.5}.hidden{display:none!important}.empty{text-align:center;padding:24px;color:var(--muted)}.footer{text-align:center;color:var(--muted);font-size:11px;padding:14px}.topstat{background:#ffffff1c;border:1px solid #ffffff30;border-radius:14px;padding:12px;margin-top:15px;display:flex;justify-content:space-between;align-items:center}.toast{position:fixed;bottom:90px;left:16px;right:16px;margin:auto;max-width:400px;background:#163a37;color:white;padding:13px 16px;border-radius:12px;z-index:10;box-shadow:0 5px 20px #0003}.smallbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px}.badge{font-size:11px;background:#fff1d6;color:#875900;padding:4px 7px;border-radius:7px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.top{padding:24px 24px 28px}.content{padding:22px}}
</style></head>
<body><div class="app" id="app">
<header class="top"><div class="toprow"><div class="brand">Khedmti <small id="tagline">خدمتي — خدمات قريبة منك</small></div><button class="lang" id="langBtn">FR</button></div><div class="welcome" id="heroTitle">شنو الخدمة اللي محتاج؟</div><div class="sub" id="heroSub">لقَى مهنيين موثوقين فمدينتك</div><div class="topstat"><div><div class="sub" id="roleLabel">كتستعمل التطبيق بصفة</div><strong id="roleName">زبون</strong></div><button class="lang" id="roleBtn">تبديل الحساب</button></div></header>
<main class="content" id="view"></main><div class="footer">Khedmti • Prototype MVP 0.1 • نسخة تجريبية</div>
<nav class="bottom"><div class="nav" id="nav"></div></nav></div><div id="toast" class="toast hidden"></div>
<script>
const translations={ar:{tagline:'خدمتي — خدمات قريبة منك',heroTitle:'شنو الخدمة اللي محتاج؟',heroSub:'لقَى مهنيين فمدينتك وقارن العروض',roleLabel:'كتستعمل التطبيق بصفة',customer:'زبون',worker:'عامل / مهني',switchRole:'تبديل الحساب',home:'الرئيسية',requests:'الطلبات',wallet:'الرصيد',profile:'حسابي',services:'الخدمات المتوفرة',allCities:'جميع مدن المغرب',chooseService:'اختار نوع الخدمة',plumbing:'السباكة',electricity:'الكهرباء',painting:'الصباغة',carpentry:'النجارة',appliance:'إصلاح الأجهزة',cleaning:'التنظيف',moving:'النقل والمساعدة',other:'خدمات أخرى',requestService:'طلب خدمة',city:'المدينة',district:'الحي / المنطقة',details:'شرح الخدمة المطلوبة',phone:'رقم الهاتف',submitRequest:'نشر الطلب',myRequests:'طلباتي',noRequests:'ما كاين حتى طلب دابا.',offer:'قدّم عرض',offers:'العروض',noOffers:'مازال ما كايناش عروض.',price:'الثمن المقترح (درهم)',arrival:'وقت الوصول التقريبي',sendOffer:'إرسال العرض',accept:'اختيار العامل',complete:'تأكيد إتمام الخدمة',cancel:'إلغاء',statusOpen:'في انتظار العروض',statusOffered:'كاينة عروض',statusAccepted:'تم اختيار العامل',statusDone:'مكتملة',statusCancelled:'ملغاة',walletTitle:'رصيد العامل',balance:'الرصيد المتوفر',topup:'طلب شحن الرصيد',topupAmount:'مبلغ الشحن (درهم)',sendTopup:'إرسال طلب الشحن',transactions:'سجل العمليات',noTransactions:'ما كايناش عمليات بعد.',workerProfile:'الملف المهني',fullName:'الاسم الكامل',profession:'المهنة',bio:'نبذة قصيرة عن خبرتك',save:'حفظ المعلومات',workerJobs:'الطلبات المتاحة',noJobs:'ما كايناش طلبات مناسبة حالياً.',cityRequired:'دخل المدينة أولاً.',successRequest:'تنشر الطلب بنجاح (تجريبي).',successOffer:'تسجل العرض (تجريبي).',successAccept:'تختار العامل بنجاح (تجريبي).',successDone:'تسجل إتمام الخدمة (تجريبي).',successTopup:'تسجل طلب الشحن للمراجعة (تجريبي).',saved:'تحفظات المعلومات.',demo:'نسخة تجريبية: البيانات محفوظة غير فهاد المتصفح. ما كاين لا أداء حقيقي لا خصم حقيقي.',admin:'لوحة الإدارة',review:'مراجعة',pending:'قيد المراجعة',credit:'شحن مؤكد',debit:'عمولة',notReady:'هاد الميزة غادي تتربط بالسيرفر فالنسخة التالية.',loginNote:'التسجيل الحقيقي والتحقق من رقم الهاتف غادي يتضافو قبل الإطلاق.'},fr:{tagline:'Khedmti — des services près de vous',heroTitle:'De quel service avez-vous besoin ?',heroSub:'Trouvez des professionnels et comparez les offres',roleLabel:'Vous utilisez l’application comme',customer:'Client',worker:'Prestataire',switchRole:'Changer de compte',home:'Accueil',requests:'Demandes',wallet:'Portefeuille',profile:'Profil',services:'Services disponibles',allCities:'Toutes les villes du Maroc',chooseService:'Choisir un service',plumbing:'Plomberie',electricity:'Électricité',painting:'Peinture',carpentry:'Menuiserie',appliance:'Réparation appareils',cleaning:'Nettoyage',moving:'Déménagement / aide',other:'Autres services',requestService:'Demander un service',city:'Ville',district:'Quartier / zone',details:'Décrivez le besoin',phone:'Téléphone',submitRequest:'Publier la demande',myRequests:'Mes demandes',noRequests:'Aucune demande pour le moment.',offer:'Faire une offre',offers:'Offres',noOffers:'Aucune offre pour le moment.',price:'Prix proposé (DH)',arrival:'Délai estimé',sendOffer:'Envoyer l’offre',accept:'Choisir ce prestataire',complete:'Confirmer la fin du service',cancel:'Annuler',statusOpen:'En attente d’offres',statusOffered:'Offres reçues',statusAccepted:'Prestataire choisi',statusDone:'Terminée',statusCancelled:'Annulée',walletTitle:'Portefeuille prestataire',balance:'Solde disponible',topup:'Demander une recharge',topupAmount:'Montant (DH)',sendTopup:'Envoyer la demande',transactions:'Historique',noTransactions:'Aucune opération.',workerProfile:'Profil professionnel',fullName:'Nom complet',profession:'Métier',bio:'Courte présentation',save:'Enregistrer',workerJobs:'Demandes disponibles',noJobs:'Aucune demande correspondante.',cityRequired:'Veuillez saisir la ville.',successRequest:'Demande publiée (démo).',successOffer:'Offre enregistrée (démo).',successAccept:'Prestataire sélectionné (démo).',successDone:'Fin du service enregistrée (démo).',successTopup:'Demande de recharge envoyée pour vérification (démo).',saved:'Informations enregistrées.',demo:'Prototype : données stockées uniquement dans ce navigateur. Aucun paiement ni débit réel.',admin:'Administration',review:'À vérifier',pending:'En attente',credit:'Recharge confirmée',debit:'Commission',notReady:'Cette fonction sera connectée au serveur dans la prochaine version.',loginNote:'L’inscription réelle et la vérification du téléphone seront ajoutées avant le lancement.'}};
const services=[['🔧','plumbing'],['⚡','electricity'],['🖌️','painting'],['🪚','carpentry'],['🧺','appliance'],['🧹','cleaning'],['🚚','moving'],['🧰','other']];let lang='ar',role='customer',page='home',selectedService='plumbing';const key='khedmti_demo_v1';let state=load();function load(){try{return JSON.parse(localStorage.getItem(key))||initial()}catch{return initial()}}function initial(){return {requests:[],offers:[],wallet:0,transactions:[],profile:{name:'',city:'',district:'',phone:'',profession:'',bio:''},topups:[]}}function save(){localStorage.setItem(key,JSON.stringify(state))}function t(k){return translations[lang][k]||k}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){let el=document.getElementById('toast');el.textContent=s;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2800)}function money(n){return Number(n||0).toLocaleString(lang==='ar'?'ar-MA':'fr-FR',{maximumFractionDigits:2})+' DH'}function status(s){return ({open:'statusOpen',offered:'statusOffered',accepted:'statusAccepted',done:'statusDone',cancelled:'statusCancelled'})[s]||s}function setPage(p){page=p;render()}function setLang(){lang=lang==='ar'?'fr':'ar';render()}function switchRole(){role=role==='customer'?'worker':'customer';page='home';render()}
function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.getElementById('tagline').textContent=t('tagline');document.getElementById('heroTitle').textContent=page==='home'?t('heroTitle'):t(({requests:'myRequests',wallet:'walletTitle',profile:'workerProfile',admin:'admin'}[page]||'services'));document.getElementById('heroSub').textContent=t('heroSub');document.getElementById('roleLabel').textContent=t('roleLabel');document.getElementById('roleName').textContent=t(role);document.getElementById('roleBtn').textContent=t('switchRole');document.getElementById('langBtn').textContent=lang==='ar'?'FR':'العربية';renderNav();let v=document.getElementById('view');if(page==='home')v.innerHTML=homeView();else if(page==='requests')v.innerHTML=requestsView();else if(page==='wallet')v.innerHTML=walletView();else if(page==='profile')v.innerHTML=profileView();else if(page==='admin')v.innerHTML=adminView();v.querySelectorAll('[data-service]').forEach(b=>b.onclick=()=>{selectedService=b.dataset.service;page='newrequest';renderNewRequest()});v.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action,b.dataset.id));if(page==='home'){let a=document.getElementById('allRequestsBtn');if(a)a.onclick=()=>setPage('requests')}if(page==='profile'){let f=document.getElementById('profileForm');f.onsubmit=e=>{e.preventDefault();state.profile={name:f.name.value,city:f.city.value,district:f.district.value,phone:f.phone.value,profession:f.profession.value,bio:f.bio.value};save();toast(t('saved'))}}if(page==='wallet'){let f=document.getElementById('topupForm');f.onsubmit=e=>{e.preventDefault();let amount=Number(f.amount.value);if(amount<20){toast('Minimum 20 DH');return}state.topups.push({id:Date.now(),amount,status:'pending',date:new Date().toISOString()});save();toast(t('successTopup'));render()}}}
function renderNav(){let items=[['home','⌂','home'],['requests','▤','requests']];if(role==='worker')items.push(['wallet','◉','wallet']);items.push(['profile','●','profile']);items.push(['admin','⚙','admin']);document.getElementById('nav').innerHTML=items.map(([p,i,k])=>`<button class="${page===p?'active':''}" data-nav="${p}"><span class="ico">${i}</span>${t(k)}</button>`).join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>setPage(b.dataset.nav))}
function homeView(){return `${role==='customer'?`<div class="sectiontitle">${t('services')}</div><div class="grid">${services.map(([emoji,k])=>`<button class="service" data-service="${k}"><div class="emoji">${emoji}</div><strong>${t(k)}</strong><span>${t('allCities')}</span></button>`).join('')}</div><div class="card" style="margin-top:14px"><div class="sectiontitle">${t('requestService')}</div><p class="muted">${t('loginNote')}</p><button class="btn" data-action="newrequest">${t('requestService')}</button></div>`:`<div class="card"><div class="sectiontitle">${t('workerJobs')}</div><p class="muted">${t('demo')}</p><button class="btn" data-action="workerjobs">${t('workerJobs')}</button></div><div class="card"><div class="sectiontitle">${t('walletTitle')}</div><div class="price">${money(state.wallet)}</div><button class="btn secondary" data-action="gotoWallet">${t('topup')}</button></div>`}<div class="notice">${t('demo')}</div>`}
function renderNewRequest(){page='newrequest';let v=document.getElementById('view');v.innerHTML=`<div class="card"><div class="sectiontitle">${t('requestService')} — ${t(selectedService)}</div><form id="requestForm"><div class="field"><label>${t('city')} *</label><input name="city" required placeholder="${lang==='ar'?'مثال: أكادير':'Ex. Agadir'}" value="${esc(state.profile.city)}"></div><div class="field"><label>${t('district')}</label><input name="district" value="${esc(state.profile.district)}"></div><div class="field"><label>${t('details')} *</label><textarea name="details" required></textarea></div><div class="field"><label>${t('phone')} *</label><input name="phone" required type="tel" value="${esc(state.profile.phone)}"></div><button class="btn">${t('submitRequest')}</button></form></div><button class="btn ghost" id="back">← ${t('home')}</button><div class="notice">${t('demo')}</div>`;document.getElementById('back').onclick=()=>setPage('home');document.getElementById('requestForm').onsubmit=e=>{e.preventDefault();let f=e.target;state.requests.unshift({id:Date.now(),service:selectedService,city:f.city.value.trim(),district:f.district.value.trim(),details:f.details.value.trim(),phone:f.phone.value.trim(),status:'open',created:new Date().toISOString(),acceptedOffer:null});save();page='requests';render();toast(t('successRequest'))}}
function requestsView(){if(role==='customer'){if(!state.requests.length)return `<div class="card empty">${t('noRequests')}<button class="btn" style="margin-top:16px" data-action="newrequest">${t('requestService')}</button></div>`;return state.requests.map(r=>`<div class="listitem"><div class="row"><strong>${t(r.service)}</strong><span class="pill">${t(status(r.status))}</span></div><p class="muted">${esc(r.city)} ${esc(r.district)} • ${new Date(r.created).toLocaleDateString()}</p><p>${esc(r.details)}</p>${offersFor(r.id).map(o=>`<div class="listitem"><strong>${money(o.price)}</strong> <span class="muted">• ${esc(o.worker||t('worker'))} • ${esc(o.arrival||'')}</span><button class="btn secondary" data-action="accept" data-id="${o.id}" ${r.status!=='open'&&r.status!=='offered'?'disabled':''}>${t('accept')}</button></div>`).join('')}${r.status==='accepted'?`<button class="btn" data-action="complete" data-id="${r.id}">${t('complete')}</button>`:''}</div>`).join('')+`<button class="btn" data-action="newrequest">${t('requestService')}</button>`}let open=state.requests.filter(r=>r.status==='open'||r.status==='offered');if(!open.length)return `<div class="card empty">${t('noJobs')}</div>`;return open.map(r=>`<div class="listitem"><div class="row"><strong>${t(r.service)}</strong><span class="pill">${esc(r.city)}</span></div><p class="muted">${esc(r.district)} • ${new Date(r.created).toLocaleDateString()}</p><p>${esc(r.details)}</p><button class="btn" data-action="offer" data-id="${r.id}">${t('offer')}</button></div>`).join('')}
function offersFor(id){return state.offers.filter(o=>o.requestId===id)}function walletView(){return `<div class="card"><div class="muted">${t('balance')}</div><div class="price">${money(state.wallet)}</div><p class="muted">20 DH / service completed</p><form id="topupForm"><div class="field"><label>${t('topupAmount')}</label><input name="amount" type="number" min="20" step="20" required placeholder="100"></div><button class="btn">${t('sendTopup')}</button></form><div class="notice">${t('demo')} ${t('notReady')}</div></div><div class="sectiontitle">${t('transactions')}</div>${state.transactions.length?state.transactions.map(x=>`<div class="listitem"><div class="row"><strong>${t(x.type==='debit'?'debit':'credit')}</strong><strong>${x.type==='debit'?'-':'+'}${money(x.amount)}</strong></div><div class="muted">${esc(x.note||'')} • ${new Date(x.date).toLocaleDateString()}</div></div>`).join(''):`<div class="card empty">${t('noTransactions')}</div>`}<div class="sectiontitle">${t('review')}</div>${state.topups.filter(x=>x.status==='pending').map(x=>`<div class="listitem"><div class="row"><span>${money(x.amount)} — ${t('pending')}</span><button class="smallbtn" data-action="demoTopup" data-id="${x.id}">${t('credit')}</button></div></div>`).join('')}`}
function profileView(){let p=state.profile;return `<div class="card"><div class="sectiontitle">${t('workerProfile')}</div><form id="profileForm"><div class="field"><label>${t('fullName')}</label><input name="name" value="${esc(p.name)}" required></div><div class="field"><label>${t('city')}</label><input name="city" value="${esc(p.city)}" required></div><div class="field"><label>${t('district')}</label><input name="district" value="${esc(p.district)}"></div><div class="field"><label>${t('phone')}</label><input name="phone" type="tel" value="${esc(p.phone)}" required></div>${role==='worker'?`<div class="field"><label>${t('profession')}</label><select name="profession">${services.map(([e,k])=>`<option value="${k}" ${p.profession===k?'selected':''}>${t(k)}</option>`).join('')}</select></div><div class="field"><label>${t('bio')}</label><textarea name="bio">${esc(p.bio)}</textarea></div>`:''}<button class="btn">${t('save')}</button></form><p class="muted">${t('loginNote')}</p></div>`}
function adminView(){return `<div class="card"><div class="sectiontitle">${t('admin')}</div><div class="notice">Prototype local uniquement. Cette page n’est pas protégée et ne doit pas être utilisée avec de vrais paiements.</div><p>${t('myRequests')}: <strong>${state.requests.length}</strong></p><p>${t('offers')}: <strong>${state.offers.length}</strong></p><p>${t('walletTitle')}: <strong>${money(state.wallet)}</strong></p><button class="btn danger" data-action="reset">${lang==='ar'?'مسح بيانات التجربة':'Réinitialiser les données de démo'}</button></div>`}
function action(a,id){if(a==='newrequest'){selectedService=selectedService||'other';renderNewRequest()}else if(a==='gotoWallet')setPage('wallet');else if(a==='workerjobs')setPage('requests');else if(a==='offer'){let r=state.requests.find(x=>String(x.id)===String(id));let price=prompt(t('price'));if(price===null)return;price=Number(price);if(!Number.isFinite(price)||price<=0){toast('Invalid price');return}let arrival=prompt(t('arrival'))||'';state.offers.push({id:Date.now(),requestId:r.id,price,arrival,worker:state.profile.name||t('worker')});r.status='offered';save();render();toast(t('successOffer'))}else if(a==='accept'){let o=state.offers.find(x=>String(x.id)===String(id));let r=state.requests.find(x=>x.id===o.requestId);r.acceptedOffer=o.id;r.status='accepted';save();render();toast(t('successAccept'))}else if(a==='complete'){let r=state.requests.find(x=>String(x.id)===String(id));if(!confirm(t('complete')+'? '+(lang==='ar'?'في النسخة الحقيقية غادي تتخصم 20 DH من رصيد العامل.':'En production, 20 DH seront débités du prestataire.')))return;r.status='done';let o=state.offers.find(x=>x.id===r.acceptedOffer);if(o){state.transactions.push({id:Date.now(),type:'debit',amount:20,note:'Commission démo — '+t(r.service),date:new Date().toISOString()})}save();render();toast(t('successDone'))}else if(a==='demoTopup'){let x=state.topups.find(x=>String(x.id)===String(id));if(x&&confirm(t('credit')+' '+money(x.amount)+'?')){x.status='credited';state.wallet+=x.amount;state.transactions.unshift({id:Date.now(),type:'credit',amount:x.amount,note:'Recharge de démonstration',date:new Date().toISOString()});save();render()}}else if(a==='reset'){if(confirm('Reset demo data?')){state=initial();save();render()}}}
document.getElementById('langBtn').onclick=setLang;document.getElementById('roleBtn').onclick=switchRole;render();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
